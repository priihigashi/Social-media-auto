name: VOTOS POST TSE — timestamped capture

on:
  push:
    branches:
      - work/votos-post-tse-20260921
    paths:
      - .github/workflows/votos_post_tse_capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing pipeline branch
        uses: actions/checkout@v4
        with:
          ref: work/votos-post-tse-20260921
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install existing pipeline dependencies
        run: pip install -r requirements.txt

      - name: Run existing capture components with timestamped Whisper output
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          from openai import OpenAI
          from transcribe_reel import download_audio
          from capture import analyze_content

          url = "https://www.instagram.com/reel/Ddi7PIlxRaj/"
          story_id = "NWS-202609211446"
          notes = (
              "Brazil political fact-check carousel about voting by provisional detainees, "
              "the TSE ruling, Constitution art. 16 annuality, Andre Mendonca pedido de vista, "
              "unanimity, Lei Antifaccao/Lei 15.358/2026, and the relevant congressional vote. "
              "Use the source transcript before editorial conclusions; neutral factual tone; "
              "draft only, not approved or published."
          )

          out = Path("transcripts")
          out.mkdir(exist_ok=True)

          with tempfile.TemporaryDirectory() as tmp:
              audio = download_audio(url, tmp)
              client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
              with open(audio, "rb") as f:
                  tr = client.audio.transcriptions.create(
                      model="whisper-1",
                      file=f,
                      language="pt",
                      response_format="verbose_json",
                      timestamp_granularities=["segment", "word"],
                      temperature=0,
                  )

          raw = tr.model_dump() if hasattr(tr, "model_dump") else tr
          segments = raw.get("segments", []) if isinstance(raw, dict) else []
          words = raw.get("words", []) if isinstance(raw, dict) else []
          text = raw.get("text", "") if isinstance(raw, dict) else str(tr)

          analysis = analyze_content(text, url, notes)

          (out / f"{story_id}_Ddi7PIlxRaj_verbose.json").write_text(
              json.dumps(raw, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (out / f"{story_id}_Ddi7PIlxRaj_editorial.json").write_text(
              json.dumps(
                  {"source_url": url, "story_id": story_id, "editorial_notes": notes, "analysis": analysis},
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          lines = [
              "TRANSCRIPT — MACHINE GENERATED (Whisper-1)",
              f"Story ID: {story_id}",
              f"Source: {url}",
              "",
              "FULL TEXT",
              text,
              "",
              "SEGMENTS",
          ]
          for s in segments:
              lines.append(f"[{float(s.get('start',0)):07.2f}–{float(s.get('end',0)):07.2f}] {str(s.get('text','')).strip()}")
          lines += ["", "WORDS"]
          for w in words:
              lines.append(f"[{float(w.get('start',0)):07.2f}–{float(w.get('end',0)):07.2f}] {str(w.get('word','')).strip()}")
          (out / f"{story_id}_Ddi7PIlxRaj_timestamped.txt").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit timestamped capture to project branch
        run: |
          git config user.name "content-capture-bot"
          git config user.email "content-capture-bot@users.noreply.github.com"
          git add transcripts/NWS-202609211446_Ddi7PIlxRaj_*
          git commit -m "capture: timestamp VOTOS POST TSE reel [skip ci]"
          git push origin HEAD:work/votos-post-tse-20260921
