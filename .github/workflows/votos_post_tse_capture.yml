name: VOTOS POST TSE — timestamped capture

on:
  push:
    branches:
      - work/votos-post-tse-20260921
    paths:
      - .github/workflows/votos_post_tse_capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout existing pipeline branch
        uses: actions/checkout@v4
        with:
          ref: work/votos-post-tse-20260921
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and existing pipeline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install faster-whisper

      - name: Download with existing pipeline and transcribe locally with timestamps
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from faster_whisper import WhisperModel
          from transcribe_reel import download_audio

          url = "https://www.instagram.com/reel/Ddi7PIlxRaj/"
          story_id = "NWS-202609211446"
          editorial_notes = (
              "Brazil political fact-check carousel about voting by provisional detainees, "
              "the TSE ruling, Constitution art. 16 annuality, Andre Mendonca pedido de vista, "
              "unanimity, Lei Antifaccao/Lei 15.358/2026, and the relevant congressional vote. "
              "Use the source transcript before editorial conclusions; neutral factual tone; "
              "draft only, not approved or published."
          )

          out = Path("transcripts")
          out.mkdir(exist_ok=True)

          with tempfile.TemporaryDirectory() as tmp:
              audio = download_audio(url, tmp)
              model = WhisperModel("small", device="cpu", compute_type="int8")
              segments_iter, info = model.transcribe(
                  audio,
                  language="pt",
                  beam_size=5,
                  vad_filter=True,
                  word_timestamps=True,
                  condition_on_previous_text=True,
              )
              segments = list(segments_iter)

          seg_json = []
          words_json = []
          full_parts = []
          for seg in segments:
              full_parts.append(seg.text.strip())
              seg_words = []
              for w in (seg.words or []):
                  item = {"start": w.start, "end": w.end, "word": w.word}
                  seg_words.append(item)
                  words_json.append(item)
              seg_json.append({
                  "start": seg.start,
                  "end": seg.end,
                  "text": seg.text.strip(),
                  "words": seg_words,
              })

          text = " ".join(x for x in full_parts if x).strip()
          payload = {
              "source_url": url,
              "story_id": story_id,
              "engine": "faster-whisper small (local GitHub Actions fallback)",
              "language": getattr(info, "language", "pt"),
              "language_probability": getattr(info, "language_probability", None),
              "duration": getattr(info, "duration", None),
              "editorial_notes": editorial_notes,
              "text": text,
              "segments": seg_json,
              "words": words_json,
          }

          (out / f"{story_id}_Ddi7PIlxRaj_verbose.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          lines = [
              "TRANSCRIPT — MACHINE GENERATED",
              f"Story ID: {story_id}",
              f"Source: {url}",
              "Engine: faster-whisper small (local fallback because API secret is not configured in this repo)",
              "",
              "EDITORIAL GUIDANCE",
              editorial_notes,
              "",
              "FULL TEXT",
              text,
              "",
              "SEGMENTS",
          ]
          for s in seg_json:
              lines.append(f"[{float(s['start']):07.2f}–{float(s['end']):07.2f}] {s['text']}")
          lines += ["", "WORDS"]
          for w in words_json:
              lines.append(f"[{float(w['start']):07.2f}–{float(w['end']):07.2f}] {w['word'].strip()}")

          (out / f"{story_id}_Ddi7PIlxRaj_timestamped.txt").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY

      - name: Commit timestamped transcript to project branch
        run: |
          git config user.name "content-capture-bot"
          git config user.email "content-capture-bot@users.noreply.github.com"
          git add transcripts/NWS-202609211446_Ddi7PIlxRaj_*
          git commit -m "capture: timestamp VOTOS POST TSE reel [skip ci]"
          git push origin HEAD:work/votos-post-tse-20260921
